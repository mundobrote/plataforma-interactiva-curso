<script>
    let alumnoSeleccionado = "";
    let speechRecognizer = null;
    let grabacionActiva = false;

    // Inicialización y configuración de la Web Speech API
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
        speechRecognizer = new SpeechAPI();
        
        // 1. Mantener la sesión activa durante las pausas del docente
        speechRecognizer.continuous = true;
        
        // 2. Permitir resultados en tiempo real y finales
        speechRecognizer.interimResults = true;
        speechRecognizer.lang = 'es-CL'; // Español de Chile

        // 3. Manejo acumulativo y continuo en el evento onresult
        speechRecognizer.onresult = function(event) {
            const textarea = document.getElementById('txtFeedbackVoz');
            let transcriptFinalNuevo = '';

            // Recorrer solo a partir del índice que cambió en este evento
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    transcriptFinalNuevo += event.results[i][0].transcript.trim() + ' ';
                }
            }

            // Si hay texto final procesado tras la pausa, concatenar acumulativamente
            if (transcriptFinalNuevo.length > 0) {
                const valorActual = textarea.value.trim();
                
                // Formateo: agregar espacio si ya existía texto previo
                if (valorActual.length > 0) {
                    textarea.value = valorActual + ' ' + transcriptFinalNuevo.trim();
                } else {
                    textarea.value = transcriptFinalNuevo.trim();
                }
                
                // Auto-scroll al final del textarea para seguir el dictado
                textarea.scrollTop = textarea.scrollHeight;
            }
        };

        // Mantener la reconexión si el motor de voz se detiene involuntariamente por silencio prolongado
        speechRecognizer.onend = function() {
            if (grabacionActiva) {
                try {
                    speechRecognizer.start();
                } catch (e) {
                    console.warn('Reanudando reconocimiento de voz...', e);
                }
            }
        };

        speechRecognizer.onerror = function(event) {
            console.error('Error en reconocimiento de voz:', event.error);
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                alternarVoz();
                alert('⚠️ Permiso de micrófono denegado. Habilita el acceso en tu navegador.');
            }
        };
    }

    function alternarVoz() {
        const btn = document.getElementById('btnMicTag');
        if (!speechRecognizer) {
            alert('El reconocimiento por voz no es compatible con este navegador. Puedes escribir el feedback manualmente.');
            return;
        }

        if (!grabacionActiva) {
            try {
                speechRecognizer.start();
                grabacionActiva = true;
                btn.classList.add('recording');
                btn.querySelector('span').innerText = 'Escuchando en sala... (Pausa libre)';
            } catch (err) {
                console.error("No se pudo iniciar el micrófono:", err);
            }
        } else {
            grabacionActiva = false;
            speechRecognizer.stop();
            btn.classList.remove('recording');
            btn.querySelector('span').innerText = 'Dictar por Voz (Sala)';
        }
    }

    function abrirMiniCex(nombre) {
        alumnoSeleccionado = nombre;
        document.getElementById('modalStudentLabel').innerText = 'Mini-CEX: ' + nombre;
        document.getElementById('txtFeedbackVoz').value = '';
        document.getElementById('modalMiniCex').style.display = 'flex';
    }

    function cerrarMiniCex() {
        if (grabacionActiva) alternarVoz();
        document.getElementById('modalMiniCex').style.display = 'none';
    }

    function setScore(btn) {
        const row = btn.parentElement;
        row.querySelectorAll('.rubric-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function guardarMiniCex() {
        if (grabacionActiva) alternarVoz();
        alert('✅ Mini-CEX registrado para ' + alumnoSeleccionado + '.\nFeedback sincronizado automáticamente en la vista del alumno.');
        cerrarMiniCex();
    }

    function delegarPEI(alumno, selectId) {
        const asignado = document.getElementById(selectId).value;
        alert('✅ Refuerzo de ' + alumno + ' delegado exitosamente a:\n' + asignado + '.\nNotificación de calendario enviada a ambas partes.');
    }

    function firmarActaMasiva() {
        const confirmacion = confirm('¿Confirmas la firma digital y el envío inmediato del acta de rotación a la Secretaría Docente de Medicina Interna?');
        if (confirmacion) {
            document.getElementById('sync-pedro').innerHTML = '📩 Recibido por Secretaría';
            document.getElementById('sync-pedro').style.color = '#16a34a';

            document.getElementById('sync-camila').innerHTML = '📩 Recibido por Secretaría';
            document.getElementById('sync-camila').style.color = '#16a34a';

            alert('🚀 CIERRE DIGITAL EXITOSO:\n\n1. PDF generado con firma criptográfica del Dr. Silva.\n2. Sincronizado vía API con el sistema central de actas.\n3. Estado actualizado a: [Recibido por Secretaría].');
        }
    }
</script>
