<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso U-Cursos | Facultad de Medicina</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #eaedf1;
      color: #333;
    }

    /* Barra Superior Institucional */
    .top-bar {
      background: #b71c1c;
      color: #ffffff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .top-bar h1 {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .top-bar span {
      font-size: 13px;
      opacity: 0.9;
    }

    /* Contenedor Central */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      flex: 1;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border-top: 4px solid #b71c1c;
    }

    .card-header-area {
      text-align: center;
      margin-bottom: 25px;
    }

    .card-header-area h2 {
      font-size: 20px;
      color: #1a202c;
      margin-bottom: 6px;
    }

    .card-header-area p {
      font-size: 12px;
      color: #718096;
    }

    /* Formulario */
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      font-size: 13px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #b71c1c;
      box-shadow: 0 0 0 3px rgba(183, 28, 28, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      background: #b71c1c;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #9a1515;
    }

    /* Credenciales Rápidas de Prueba */
    .quick-access-box {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #718096;
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
    }

    .quick-access-box strong {
      color: #2d3748;
      display: block;
      margin-bottom: 6px;
    }

    .quick-btn {
      background: #edf2f7;
      border: 1px solid #cbd5e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      margin-right: 5px;
      margin-top: 4px;
    }

    .quick-btn:hover {
      background: #e2e8f0;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #a0aec0;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header class="top-bar">
    <h1>U-Cursos | Plataforma de Internado Clínico</h1>
    <span>Medicina 2026</span>
  </header>

  <!-- Login Form -->
  <main class="login-container">
    <div class="login-card">
      <div class="card-header-area">
        <h2>Iniciar Sesión</h2>
        <p>Ingresa con tu cuenta institucional de U-Cursos</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="username">Usuario Institucional</label>
          <input type="text" id="username" placeholder="ej: paul.araneda o docente" required autofocus />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-submit">Ingresar a la Plataforma</button>
      </form>

      <!-- Botones de acceso rápido para pruebas -->
      <div class="quick-access-box">
        <strong>Accesos rápidos de prueba:</strong>
        <button type="button" class="quick-btn" onclick="rellenar('paul.araneda', '16102002')">👤 Perfil Estudiante</button>
        <button type="button" class="quick-btn" onclick="rellenar('docente', '16102002')">👨‍⚕️ Perfil Docente</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    © 2026 Universidad de Chile - Plataforma de Gestión de Internado
  </footer>

  <script>
    function rellenar(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const user = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;

      // 1. Acceso Estudiante
      if (user === 'paul.araneda' && pass === '16102002') {
        // Redirige a tu archivo de estudiante (cámbialo al nombre exacto de tu archivo HTML si es distinto)
        window.location.href = 'index (11).html';
        return;
      }

      // 2. Acceso Docente
      if (user === 'docente' && pass === '16102002') {
        // Redirige a la vista del docente
        window.location.href = 'docente.html';
        return;
      }

      // Error de credenciales
      alert('⚠️ Usuario o contraseña incorrectos.\n\nPrueba con:\n- Estudiante: paul.araneda / 16102002\n- Docente: docente / 16102002');
    });
  </script>
</body>
</html>
